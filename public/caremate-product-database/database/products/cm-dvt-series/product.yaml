features:
  en:
  - Portable pneumatic-compression system that mimics natural muscle-pump action to enhance limb blood
    flow and help prevent DVT
  - Non-invasive therapy suitable for both home and clinical use
  - Promotes venous return and overall circulation
  - Helps reduce post-operative pain and swelling
  - Accelerates wound-healing time
  - Adjunctive treatment for stasis dermatitis, venous stasis ulcers, arterial & diabetic leg ulcers
  - Relieves chronic venous insufficiency and lowers limb-edema levels
